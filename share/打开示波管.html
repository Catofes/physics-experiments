    <script type="module">
      import * as THREE from 'https://esm.sh/three@0.185.1';
      import { OrbitControls } from 'https://esm.sh/three@0.185.1/examples/jsm/controls/OrbitControls.js';

const GEO = {
    gunExit: -4.35,
    yPlate: {
        start: -3.45,
        end: -2.35
    },
    xPlate: {
        start: -1.95,
        end: -0.85
    },
    screenX: 5.6,
    screenR: 2.35,
    v0: 6,
    gainY: 0.044,
    gainX: 0.052
};
const TWO_PI = Math.PI * 2;
function sawtooth(t, freq, amp, flyback, phaseDeg = 0) {
    if (freq <= 0 || amp <= 0) return {
        v: 0,
        blank: false
    };
    const period = 1 / freq;
    const phase = (t % period / period + phaseDeg / 360) % 1;
    const traceFrac = 1 - flyback;
    if (phase < traceFrac) {
        const k = phase / traceFrac;
        return {
            v: -amp + 2 * amp * k,
            blank: false
        };
    }
    const k = (phase - traceFrac) / Math.max(flyback, 1e-4);
    return {
        v: amp - 2 * amp * Math.min(k, 1),
        blank: true
    };
}
function signalWave(type, phase) {
    switch(type){
        case 'sine':
            return Math.sin(phase);
        case 'square':
            return Math.sin(phase) >= 0 ? 1 : -1;
        case 'triangle':
            return 2 / Math.PI * Math.asin(Math.sin(phase));
        case 'dc':
        default:
            return 0;
    }
}
function sampleVoltages(state, t) {
    const yPhaseRad = state.yPhase * Math.PI / 180;
    const ac = state.ySignal === 'dc' ? 0 : signalWave(state.ySignal, TWO_PI * state.yFreq * t + yPhaseRad) * state.yAmp;
    const uy = state.yDc + ac;
    const sweep = state.sweepOn ? sawtooth(t, state.sweepFreq, state.sweepAmp, state.flyback, state.sweepPhase) : {
        v: 0,
        blank: false
    };
    return {
        t,
        uy,
        ux: sweep.v,
        blank: state.sweepOn ? sweep.blank : false
    };
}
function computeBeam(uy, ux) {
    const { gunExit, yPlate, xPlate, screenX, v0, gainY, gainX } = GEO;
    const ay = uy * gainY * v0 * v0 / ((yPlate.end - yPlate.start) * (screenX - (yPlate.start + yPlate.end) / 2));
    const az = -(ux * gainX * v0 * v0) / ((xPlate.end - xPlate.start) * (screenX - (xPlate.start + xPlate.end) / 2));
    const pts = [];
    const push = (x, y, z)=>pts.push({
            x,
            y,
            z
        });
    push(gunExit, 0, 0);
    let x = gunExit;
    let y = 0;
    let z = 0;
    let vy = 0;
    let vz = 0;
    {
        const x0 = yPlate.start;
        const x1 = yPlate.end;
        const dt = (x1 - x0) / v0;
        push(x0, y, z);
        const STEPS = 8;
        for(let i = 1; i < STEPS; i++){
            const tt = dt * i / STEPS;
            push(x0 + v0 * tt, y + vy * tt + 0.5 * ay * tt * tt, z);
        }
        y = y + vy * dt + 0.5 * ay * dt * dt;
        vy = vy + ay * dt;
        x = x1;
        push(x, y, z);
    }
    {
        const x1 = xPlate.start;
        const dt = (x1 - x) / v0;
        y = y + vy * dt;
        z = z + vz * dt;
        x = x1;
        push(x, y, z);
    }
    {
        const x1 = xPlate.end;
        const dt = (x1 - x) / v0;
        const STEPS = 8;
        for(let i = 1; i <= STEPS; i++){
            const tt = dt * i / STEPS;
            push(x + v0 * tt, y + vy * tt, z + vz * tt + 0.5 * az * tt * tt);
        }
        y = y + vy * dt;
        z = z + vz * dt + 0.5 * az * dt * dt;
        vz = vz + az * dt;
        x = x1;
    }
    {
        const dt = (screenX - x) / v0;
        y = y + vy * dt;
        z = z + vz * dt;
        push(screenX, y, z);
    }
    return pts;
}
function screenSpot(uy, ux) {
    return {
        y: GEO.gainY * uy,
        sx: GEO.gainX * ux
    };
}
const DEFAULT_STATE = {
    ySignal: 'sine',
    yDc: 0,
    yAmp: 22,
    yFreq: 0.5,
    yPhase: 0,
    sweepOn: true,
    sweepAmp: 24,
    sweepFreq: 0.5,
    sweepPhase: 0,
    flyback: 0.08,
    persistence: 0.82
};



function makeLabelTexture(text, opts = {}) {
    const { color = '#e6edf6', accent = '#38e1ff', sub } = opts;
    const dpr = 2;
    const fontSize = 30;
    const subFontSize = 20;
    const padX = 18;
    const padY = 10;
    const measure = document.createElement('canvas').getContext('2d');
    if (!measure) throw new Error('canvas 2d context unavailable');
    measure.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif`;
    const mainW = measure.measureText(text).width;
    let subW = 0;
    if (sub) {
        measure.font = `500 ${subFontSize}px ui-monospace, Menlo, Consolas, monospace`;
        subW = measure.measureText(sub).width;
    }
    const w = Math.ceil(Math.max(mainW, subW) + padX * 2);
    const h = Math.ceil(fontSize + padY * 2 + (sub ? subFontSize + 4 : 0));
    const canvas = document.createElement('canvas');
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('canvas 2d context unavailable');
    ctx.scale(dpr, dpr);
    const radius = 8;
    ctx.beginPath();
    ctx.roundRect(0.5, 0.5, w - 1, h - 1, radius);
    ctx.fillStyle = 'rgba(14, 22, 34, 0.78)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(56, 225, 255, 0.35)';
    ctx.stroke();
    ctx.fillStyle = accent;
    ctx.fillRect(0.5, 6, 3, h - 12);
    ctx.fillStyle = color;
    ctx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, padX, sub ? padY + fontSize / 2 - 2 : h / 2);
    if (sub) {
        ctx.fillStyle = accent;
        ctx.font = `500 ${subFontSize}px ui-monospace, Menlo, Consolas, monospace`;
        ctx.fillText(sub, padX, padY + fontSize + 4 + subFontSize / 2);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
}
function makeLabelSprite(text, opts = {}) {
    const tex = makeLabelTexture(text, opts);
    const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: false
    });
    const sprite = new THREE.Sprite(mat);
    const aspect = tex.image.width / tex.image.height;
    const height = opts.scale ?? 0.42;
    sprite.scale.set(height * aspect, height, 1);
    sprite.renderOrder = 50;
    return sprite;
}






const VIEWS = {
    perspective: {
        pos: new THREE.Vector3(8.6, 4.4, 7.8),
        target: new THREE.Vector3(0.6, 0, 0)
    },
    front: {
        pos: new THREE.Vector3(GEO.screenX + 3.4, 0.15, 0.01),
        target: new THREE.Vector3(GEO.screenX, 0, 0)
    },
    side: {
        pos: new THREE.Vector3(0.4, 1.4, 12.5),
        target: new THREE.Vector3(0.4, 0, 0)
    },
    top: {
        pos: new THREE.Vector3(0.4, 12.5, 0.01),
        target: new THREE.Vector3(0.4, 0, 0)
    }
};
const COLOR = {
    bg: 0x070b12,
    glass: 0x9fc6e8,
    metal: 0xb8c2d0,
    beam: 0xff5d8f,
    beamCore: 0xffd7e0,
    phosphor: 0x7dffa8,
    filament: 0xff8a3d,
    pos: 0xff4d6d,
    neg: 0x38e1ff
};
const ELECTRON_COUNT = 26;
function makeGlowTexture(inner, outer) {
    const s = 64;
    const canvas = document.createElement('canvas');
    canvas.width = s;
    canvas.height = s;
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('canvas 2d context unavailable');
    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, inner);
    g.addColorStop(0.4, outer);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
class ScopeScene {
    container;
    renderer;
    scene = new THREE.Scene();
    camera;
    controls;
    clock = new THREE.Clock();
    simTime = 0;
    raf = 0;
    resizeObserver;
    state;
    viewTransition = null;
    yPlates = [];
    xPlates = [];
    yTerminals = [];
    xTerminals = [];
    filament;
    beamLine;
    beamGlow;
    electrons;
    electronPhases = new Float32Array(ELECTRON_COUNT);
    screenCanvas;
    screenCtx;
    screenTexture;
    clearRequested = false;
    onSample = null;
    constructor(container, state){
        this.container = container;
        this.state = {
            ...state
        };
        this.renderer = new THREE.WebGLRenderer({
            antialias: true
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(container.clientWidth, container.clientHeight);
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.15;
        container.appendChild(this.renderer.domElement);
        this.scene.background = new THREE.Color(COLOR.bg);
        this.scene.fog = new THREE.Fog(COLOR.bg, 18, 42);
        this.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        this.camera.position.copy(VIEWS.perspective.pos);
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.target.copy(VIEWS.perspective.target);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.08;
        this.controls.minDistance = 3.5;
        this.controls.maxDistance = 32;
        this.controls.addEventListener('start', ()=>{
            this.viewTransition = null;
        });
        this.buildLights();
        this.buildTube();
        this.buildGun();
        this.buildPlatesAndTerminals();
        this.buildScreen();
        this.buildBeam();
        this.buildLabels();
        this.buildFloor();
        for(let i = 0; i < ELECTRON_COUNT; i++){
            this.electronPhases[i] = i / ELECTRON_COUNT;
        }
        this.resizeObserver = new ResizeObserver(()=>this.handleResize());
        this.resizeObserver.observe(container);
        this.animate();
    }
    updateState(patch) {
        Object.assign(this.state, patch);
    }
    setView(name) {
        const v = VIEWS[name];
        this.viewTransition = {
            fromPos: this.camera.position.clone(),
            toPos: v.pos.clone(),
            fromTarget: this.controls.target.clone(),
            toTarget: v.target.clone(),
            t: 0
        };
    }
    clearPhosphor() {
        this.clearRequested = true;
    }
    dispose() {
        cancelAnimationFrame(this.raf);
        this.resizeObserver.disconnect();
        this.controls.dispose();
        this.renderer.dispose();
        this.screenTexture.dispose();
        this.renderer.domElement.remove();
    }
    buildLights() {
        this.scene.add(new THREE.AmbientLight(0x88aacc, 0.55));
        const key = new THREE.DirectionalLight(0xcfe6ff, 1.1);
        key.position.set(6, 10, 8);
        this.scene.add(key);
        const fill = new THREE.DirectionalLight(0x335577, 0.5);
        fill.position.set(-8, -4, -6);
        this.scene.add(fill);
        const warm = new THREE.PointLight(COLOR.filament, 1.4, 6, 2);
        warm.position.set(-4.9, 0, 0);
        this.scene.add(warm);
        const screenGlow = new THREE.PointLight(COLOR.phosphor, 0.9, 8, 2);
        screenGlow.position.set(GEO.screenX - 0.5, 0, 0);
        this.scene.add(screenGlow);
    }
    glassMaterial() {
        return new THREE.MeshPhysicalMaterial({
            color: COLOR.glass,
            transparent: true,
            opacity: 0.1,
            roughness: 0.08,
            metalness: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
            clearcoat: 1,
            clearcoatRoughness: 0.1
        });
    }
    buildTube() {
        const glass = this.glassMaterial();
        const neckLen = 2.6 - -5.2;
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, neckLen, 48, 1, true), glass);
        neck.rotation.z = -Math.PI / 2;
        neck.position.x = (-5.2 + 2.6) / 2;
        this.scene.add(neck);
        const coneLen = GEO.screenX - 2.6;
        const cone = new THREE.Mesh(new THREE.CylinderGeometry(GEO.screenR + 0.15, 1.05, coneLen, 48, 1, true), glass);
        cone.rotation.z = -Math.PI / 2;
        cone.position.x = (2.6 + GEO.screenX) / 2;
        this.scene.add(cone);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x6fa8c9,
            transparent: true,
            opacity: 0.35,
            depthWrite: false
        });
        const ringXs = [
            [
                -5.2,
                1.05
            ],
            [
                2.6,
                1.05
            ],
            [
                GEO.screenX,
                GEO.screenR + 0.15
            ]
        ];
        for (const [x, r] of ringXs){
            const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.025, 10, 64), ringMat);
            ring.rotation.y = Math.PI / 2;
            ring.position.x = x;
            this.scene.add(ring);
        }
    }
    buildGun() {
        const metal = new THREE.MeshStandardMaterial({
            color: COLOR.metal,
            metalness: 0.85,
            roughness: 0.35
        });
        const darkMetal = new THREE.MeshStandardMaterial({
            color: 0x5a6675,
            metalness: 0.9,
            roughness: 0.4
        });
        const cathode = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.7, 32), darkMetal);
        cathode.rotation.z = -Math.PI / 2;
        cathode.position.set(-4.95, 0, 0);
        this.scene.add(cathode);
        this.filament = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.035, 10, 24), new THREE.MeshBasicMaterial({
            color: COLOR.filament
        }));
        this.filament.rotation.y = Math.PI / 2;
        this.filament.position.set(-5.05, 0, 0);
        this.scene.add(this.filament);
        const discXs = [
            -4.62,
            -4.38
        ];
        const discRs = [
            0.55,
            0.72
        ];
        discXs.forEach((x, i)=>{
            const disc = new THREE.Mesh(new THREE.TorusGeometry(discRs[i], 0.07, 12, 48), metal);
            disc.rotation.y = Math.PI / 2;
            disc.position.x = x;
            this.scene.add(disc);
            const cap = new THREE.Mesh(new THREE.CircleGeometry(discRs[i], 48), new THREE.MeshBasicMaterial({
                color: 0x3a4656,
                transparent: true,
                opacity: 0.28,
                side: THREE.DoubleSide,
                depthWrite: false
            }));
            cap.rotation.y = Math.PI / 2;
            cap.position.x = x - 0.01;
            this.scene.add(cap);
        });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 0.5, 32), darkMetal);
        base.rotation.z = -Math.PI / 2;
        base.position.set(-5.45, 0, 0);
        this.scene.add(base);
    }
    buildPlatesAndTerminals() {
        const plateMat = ()=>new THREE.MeshStandardMaterial({
                color: COLOR.metal,
                metalness: 0.9,
                roughness: 0.3,
                emissive: 0x000000,
                emissiveIntensity: 0.6
            });
        const yLen = GEO.yPlate.end - GEO.yPlate.start;
        const yMid = (GEO.yPlate.start + GEO.yPlate.end) / 2;
        const xLen = GEO.xPlate.end - GEO.xPlate.start;
        const xMid = (GEO.xPlate.start + GEO.xPlate.end) / 2;
        const yGeo = new THREE.BoxGeometry(yLen, 0.07, 0.72);
        const yTop = new THREE.Mesh(yGeo, plateMat());
        yTop.position.set(yMid, 0.42, 0);
        const yBottom = new THREE.Mesh(yGeo, plateMat());
        yBottom.position.set(yMid, -0.42, 0);
        this.yPlates.push(yTop, yBottom);
        this.scene.add(yTop, yBottom);
        const xGeo = new THREE.BoxGeometry(xLen, 0.72, 0.07);
        const xFront = new THREE.Mesh(xGeo, plateMat());
        xFront.position.set(xMid, 0, 0.42);
        const xBack = new THREE.Mesh(xGeo, plateMat());
        xBack.position.set(xMid, 0, -0.42);
        this.xPlates.push(xFront, xBack);
        this.scene.add(xFront, xBack);
        const terminalGeo = new THREE.SphereGeometry(0.09, 20, 16);
        const stalkMat = new THREE.MeshStandardMaterial({
            color: 0x8b97a7,
            metalness: 0.8,
            roughness: 0.4
        });
        const makeTerminal = (pos, stalkFrom)=>{
            const dir = new THREE.Vector3().subVectors(pos, stalkFrom);
            const len = dir.length();
            const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, len, 8), stalkMat);
            stalk.position.copy(stalkFrom).addScaledVector(dir, 0.5);
            stalk.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            this.scene.add(stalk);
            const ball = new THREE.Mesh(terminalGeo, new THREE.MeshStandardMaterial({
                color: 0x222a36,
                emissive: COLOR.neg,
                emissiveIntensity: 1.2,
                metalness: 0.4,
                roughness: 0.4
            }));
            ball.position.copy(pos);
            this.scene.add(ball);
            return ball;
        };
        this.yTerminals.push(makeTerminal(new THREE.Vector3(yMid, 1.62, 0), new THREE.Vector3(yMid, 0.46, 0)), makeTerminal(new THREE.Vector3(yMid, -1.62, 0), new THREE.Vector3(yMid, -0.46, 0)));
        this.xTerminals.push(makeTerminal(new THREE.Vector3(xMid, 0.85, 1.62), new THREE.Vector3(xMid, 0.85, 0.46)), makeTerminal(new THREE.Vector3(xMid, 0.85, -1.62), new THREE.Vector3(xMid, 0.85, -0.46)));
    }
    buildScreen() {
        const size = 512;
        this.screenCanvas = document.createElement('canvas');
        this.screenCanvas.width = size;
        this.screenCanvas.height = size;
        const ctx = this.screenCanvas.getContext('2d');
        if (!ctx) throw new Error('canvas 2d context unavailable');
        this.screenCtx = ctx;
        ctx.fillStyle = '#07120c';
        ctx.fillRect(0, 0, size, size);
        this.screenTexture = new THREE.CanvasTexture(this.screenCanvas);
        this.screenTexture.colorSpace = THREE.SRGBColorSpace;
        this.screenTexture.anisotropy = 8;
        const screenMat = new THREE.MeshBasicMaterial({
            map: this.screenTexture,
            side: THREE.DoubleSide,
            toneMapped: false
        });
        const screen = new THREE.Mesh(new THREE.CircleGeometry(GEO.screenR, 64), screenMat);
        screen.rotation.y = Math.PI / 2;
        screen.position.x = GEO.screenX;
        this.scene.add(screen);
        const bezel = new THREE.Mesh(new THREE.TorusGeometry(GEO.screenR + 0.08, 0.07, 14, 72), new THREE.MeshStandardMaterial({
            color: COLOR.metal,
            metalness: 0.9,
            roughness: 0.3
        }));
        bezel.rotation.y = Math.PI / 2;
        bezel.position.x = GEO.screenX - 0.02;
        this.scene.add(bezel);
    }
    buildBeam() {
        const glowMat = new THREE.LineBasicMaterial({
            color: COLOR.beam,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const coreMat = new THREE.LineBasicMaterial({
            color: COLOR.beamCore,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        this.beamGlow = new THREE.Line(new THREE.BufferGeometry(), glowMat);
        this.beamLine = new THREE.Line(new THREE.BufferGeometry(), coreMat);
        this.beamGlow.frustumCulled = false;
        this.beamLine.frustumCulled = false;
        this.scene.add(this.beamGlow, this.beamLine);
        const positions = new Float32Array(ELECTRON_COUNT * 3);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
            size: 0.22,
            map: makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,93,143,0.85)'),
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true,
            toneMapped: false
        });
        this.electrons = new THREE.Points(geo, mat);
        this.electrons.frustumCulled = false;
        this.scene.add(this.electrons);
    }
    buildLabels() {
        const add = (text, pos, opts = {})=>{
            const s = makeLabelSprite(text, opts);
            s.position.set(...pos);
            this.scene.add(s);

        });
        add('Uy', [

        add('Ux', [
            -0.75,
            1.2,
            1.75
        ], {
            accent: '#38e1ff',
            scale: 0.3
        });
    }
    buildFloor() {
        const grid = new THREE.GridHelper(36, 36, 0x1d3a52, 0x122233);
        grid.position.y = -2.7;
        grid.material.transparent = true;
        grid.material.opacity = 0.35;
        this.scene.add(grid);
    }
    handleResize() {
        const w = this.container.clientWidth;
        const h = this.container.clientHeight;
        if (w === 0 || h === 0) return;
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h);
    }
    setTerminalColor(ball, positive) {
        const mat = ball.material;
        mat.emissive.setHex(positive ? COLOR.pos : COLOR.neg);
        mat.color.setHex(positive ? 0x3a1220 : 0x0e2a33);
    }
    tintPlate(plate, colorHex, strength) {
        const mat = plate.material;
        if (strength < 0.02) {
            mat.emissive.setHex(0x000000);
            return;
        }
        mat.emissive.setHex(colorHex);
        mat.emissiveIntensity = strength;
    }
    updateBeam(points, blank) {
        const v3 = points.map((p)=>new THREE.Vector3(p.x, p.y, p.z));
        const setLine = (line)=>{
            line.geometry.dispose();
            line.geometry = new THREE.BufferGeometry().setFromPoints(v3);
        };
        setLine(this.beamLine);
        setLine(this.beamGlow);
        const coreMat = this.beamLine.material;
        const glowMat = this.beamGlow.material;
        coreMat.opacity = blank ? 0.15 : 0.95;
        glowMat.opacity = blank ? 0.05 : 0.3;
        const cum = [
            0
        ];
        let total = 0;
        for(let i = 1; i < points.length; i++){
            const dx = points[i].x - points[i - 1].x;
            const dy = points[i].y - points[i - 1].y;
            const dz = points[i].z - points[i - 1].z;
            total += Math.sqrt(dx * dx + dy * dy + dz * dz);
            cum.push(total);
        }
        const posAttr = this.electrons.geometry.getAttribute('position');
        const speed = 0.55;
        for(let i = 0; i < ELECTRON_COUNT; i++){
            let p = (this.electronPhases[i] + this.simTime * speed) % 1;
            const dist = p * total;
            let seg = 0;
            while(seg < cum.length - 2 && cum[seg + 1] < dist)seg++;
            const segLen = cum[seg + 1] - cum[seg] || 1;
            const f = (dist - cum[seg]) / segLen;
            const a = points[seg];
            const b = points[seg + 1];
            posAttr.setXYZ(i, a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, a.z + (b.z - a.z) * f);
        }
        posAttr.needsUpdate = true;
        this.electrons.material.opacity = blank ? 0.2 : 1;
    }
    drawGraticule(ctx, size) {
        const c = size / 2;
        const r = size * 0.43;
        ctx.save();
        ctx.strokeStyle = 'rgba(125, 255, 168, 0.05)';
        ctx.lineWidth = 1;
        [
            0.33,
            0.66,
            1
        ].forEach((k)=>{
            ctx.beginPath();
            ctx.arc(c, c, r * k, 0, Math.PI * 2);
            ctx.stroke();
        });
        ctx.strokeStyle = 'rgba(125, 255, 168, 0.09)';
        ctx.beginPath();
        ctx.moveTo(c - r, c);
        ctx.lineTo(c + r, c);
        ctx.moveTo(c, c - r);
        ctx.lineTo(c, c + r);
        ctx.stroke();
        for(let i = -4; i <= 4; i++){
            if (i === 0) continue;
            const t = r * i / 4;
            ctx.beginPath();
            ctx.moveTo(c + t, c - 5);
            ctx.lineTo(c + t, c + 5);
            ctx.moveTo(c - 5, c + t);
            ctx.lineTo(c + 5, c + t);
            ctx.stroke();
        }
        ctx.fillStyle = 'rgba(125, 255, 168, 0.28)';
        ctx.font = '600 20px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Y', c, c - r - 4);
        ctx.fillText('Y′', c, c + r + 4);
        ctx.fillText('X′', c - r - 16, c);
        ctx.fillText('X', c + r + 16, c);
        ctx.restore();
    }
    updatePhosphor(spotY, spotSx, blank, dt) {
        const ctx = this.screenCtx;
        const size = this.screenCanvas.width;
        if (this.clearRequested) {
            ctx.fillStyle = '#07120c';
            ctx.fillRect(0, 0, size, size);
            this.clearRequested = false;
        }
        const fadeAlpha = 0.32 * Math.pow(1 - this.state.persistence, 1.6) + 0.008;
        ctx.fillStyle = `rgba(7, 18, 12, ${Math.min(fadeAlpha * dt * 60, 1)})`;
        ctx.fillRect(0, 0, size, size);
        this.drawGraticule(ctx, size);
        if (!blank) {
            const c = size / 2;
            const pxPerUnit = size / (2 * GEO.screenR);
            const px = c + spotSx * pxPerUnit;
            const py = c - spotY * pxPerUnit;
            const glow = ctx.createRadialGradient(px, py, 0, px, py, 30);
            glow.addColorStop(0, 'rgba(125, 255, 168, 0.55)');
            glow.addColorStop(0.35, 'rgba(74, 222, 128, 0.22)');
            glow.addColorStop(1, 'rgba(74, 222, 128, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(px, py, 30, 0, Math.PI * 2);
            ctx.fill();
            const core = ctx.createRadialGradient(px, py, 0, px, py, 7);
            core.addColorStop(0, 'rgba(255, 240, 245, 1)');
            core.addColorStop(0.5, 'rgba(255, 120, 165, 0.9)');
            core.addColorStop(1, 'rgba(255, 93, 143, 0)');
            ctx.fillStyle = core;
            ctx.beginPath();
            ctx.arc(px, py, 7, 0, Math.PI * 2);
            ctx.fill();
        }
        this.screenTexture.needsUpdate = true;
    }
    updateCamera(dt) {
        const tr = this.viewTransition;
        if (!tr) return;
        tr.t = Math.min(tr.t + dt / 0.9, 1);
        const e = 1 - Math.pow(1 - tr.t, 3);
        this.camera.position.lerpVectors(tr.fromPos, tr.toPos, e);
        this.controls.target.lerpVectors(tr.fromTarget, tr.toTarget, e);
        if (tr.t >= 1) this.viewTransition = null;
    }
    animate = ()=>{
        this.raf = requestAnimationFrame(this.animate);
        const dt = Math.min(this.clock.getDelta(), 0.05);
        this.simTime += dt;
        const sample = sampleVoltages(this.state, this.simTime);
        const { y: spotY, sx: spotSx } = screenSpot(sample.uy, sample.ux);
        const beam = computeBeam(sample.uy, sample.ux);
        this.updateBeam(beam, sample.blank);
        this.updatePhosphor(spotY, spotSx, sample.blank, dt);
        const fMat = this.filament.material;
        const pulse = 0.75 + 0.25 * Math.sin(this.simTime * 6);
        fMat.color.setRGB(1, 0.54 * pulse + 0.2, 0.24 * pulse + 0.08);
        const yStrength = Math.min(Math.abs(sample.uy) / 40, 1) * 0.5;
        this.tintPlate(this.yPlates[0], sample.uy >= 0 ? COLOR.pos : COLOR.neg, yStrength);
        this.tintPlate(this.yPlates[1], sample.uy >= 0 ? COLOR.neg : COLOR.pos, yStrength);
        const xStrength = Math.min(Math.abs(sample.ux) / 40, 1) * 0.5;
        this.tintPlate(this.xPlates[1], sample.ux >= 0 ? COLOR.pos : COLOR.neg, xStrength);
        this.tintPlate(this.xPlates[0], sample.ux >= 0 ? COLOR.neg : COLOR.pos, xStrength);
        this.setTerminalColor(this.yTerminals[0], sample.uy >= 0);
        this.setTerminalColor(this.yTerminals[1], sample.uy < 0);
        this.setTerminalColor(this.xTerminals[1], sample.ux >= 0);
        this.setTerminalColor(this.xTerminals[0], sample.ux < 0);
        this.updateCamera(dt);
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
        if (this.onSample) {
            this.onSample({
                ...sample,
                spotY,
                spotSx
            });
        }
    };
}

        min: 0,
        max: 360,
        step: 5,
        get: ()=>state.sweepPhase,
        set: (v)=>{
            state.sweepPhase = v;
        },
        format: (v)=>`${Math.round(v)}°`,
        disabled: ()=>!state.sweepOn
    });
    buildSlider(xContainer, {
        label: '回扫消隐占比',
        accent: CYAN,
        min: 0,
        max: 0.3,
        step: 0.01,
        get: ()=>state.flyback,
        set: (v)=>{
            state.flyback = v;
        },
        format: (v)=>`${(v * 100).toFixed(0)}%`,
        disabled: ()=>!state.sweepOn
    });
    const screenContainer = $('#sliders-screen');
    buildSlider(screenContainer, {
        label: '余晖强度',
        accent: GREEN,
        min: 0,
        max: 0.97,
        step: 0.01,
        get: ()=>state.persistence,
        set: (v)=>{
            state.persistence = v;
        },
        format: (v)=>`${Math.round(v * 100)}%`
    });
    const syncDisabled = ()=>{
        sliderRows.forEach((r)=>{
            const input = r.input;
            if (input && r.disabled) input.disabled = r.disabled();
        });
    };
    syncDisabled();
    const sweepToggle = $('#sweep-toggle');
    sweepToggle.addEventListener('change', ()=>{
        state.sweepOn = sweepToggle.checked;
        cb.onStateChange({
            sweepOn: state.sweepOn
        });
        syncDisabled();
    });
    $('#clear-btn').addEventListener('click', ()=>cb.onClear());
    const uyReadout = $('#uy-readout');
    const uxReadout = $('#ux-readout');
    const panel = $('#control-panel');
    const panelToggle = $('#panel-toggle');
    const isNarrow = ()=>window.matchMedia('(max-width: 640px)').matches;
    let panelOpen = !isNarrow();
    const applyPanel = ()=>{
        panel.classList.toggle('hidden', !panelOpen);
        panelToggle.textContent = panelOpen ? '收起面板' : '控制面板';
    };
    panelToggle.addEventListener('click', ()=>{
        panelOpen = !panelOpen;
        applyPanel();
    });
    applyPanel();
    const wrap = $('#monitor-wrap');
    const dragHandle = $('#monitor-drag');
    const resizeHandle = $('#monitor-resize');
    const resetBtn = $('#monitor-reset');
    const monitor = $('#monitor');
    const mctx = monitor.getContext('2d');
    if (!mctx) throw new Error('monitor 2d context unavailable');
    const STORE_KEY = 'scope-monitor-layout';
    const clamp = (v, lo, hi)=>Math.min(Math.max(v, lo), hi);
    const defaultLayout = ()=>{
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        if (vw < 640) {
            const w = Math.min(280, vw - 24);
            return {
                x: Math.round((vw - w) / 2),
                y: Math.round(vh - 208),
                w,
                h: 168
            };
        }
        return {
            x: 16,
            y: Math.round(vh - 244),
            w: 320,
            h: 196
        };
    };
    let layout = defaultLayout();
    try {
        const saved = localStorage.getItem(STORE_KEY);
        if (saved) {
            const p = JSON.parse(saved);
            if (p && typeof p.x === 'number' && typeof p.y === 'number' && typeof p.w === 'number' && typeof p.h === 'number') {
                layout = {
                    x: p.x,
                    y: p.y,
                    w: p.w,
                    h: p.h
                };
            }
        }
    } catch  {}
    const applyLayout = ()=>{
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        layout.w = clamp(layout.w, 190, vw - 16);
        layout.h = clamp(layout.h, 120, vh - 16);
        layout.x = clamp(layout.x, 0, vw - layout.w);
        layout.y = clamp(layout.y, 0, vh - layout.h);
        wrap.style.left = `${layout.x}px`;
        wrap.style.top = `${layout.y}px`;
        wrap.style.width = `${layout.w}px`;
        wrap.style.height = `${layout.h}px`;
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify(layout));
        } catch  {}
    };
    applyLayout();
    resetBtn.addEventListener('pointerdown', (e)=>e.stopPropagation());
    resetBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        layout = defaultLayout();
        applyLayout();
    });
    const beginDrag = (e)=>{
        e.preventDefault();
        dragHandle.setPointerCapture(e.pointerId);
        const startX = e.clientX;
        const startY = e.clientY;
        const originX = layout.x;
        const originY = layout.y;
        const onMove = (ev)=>{
            layout.x = originX + ev.clientX - startX;
            layout.y = originY + ev.clientY - startY;
            applyLayout();
        };
        const onUp = (ev)=>{
            dragHandle.releasePointerCapture(ev.pointerId);
            dragHandle.removeEventListener('pointermove', onMove);
            dragHandle.removeEventListener('pointerup', onUp);
            dragHandle.removeEventListener('pointercancel', onUp);
        };
        dragHandle.addEventListener('pointermove', onMove);
        dragHandle.addEventListener('pointerup', onUp);
        dragHandle.addEventListener('pointercancel', onUp);
    };
    dragHandle.addEventListener('pointerdown', beginDrag);
    const beginResize = (e)=>{
        e.preventDefault();
        e.stopPropagation();
        resizeHandle.setPointerCapture(e.pointerId);
        const startX = e.clientX;
        const startY = e.clientY;
        const originW = layout.w;
        const originH = layout.h;
        const onMove = (ev)=>{
            layout.w = originW + ev.clientX - startX;
            layout.h = originH + ev.clientY - startY;
            applyLayout();
        };
        const onUp = (ev)=>{
            resizeHandle.releasePointerCapture(ev.pointerId);
            resizeHandle.removeEventListener('pointermove', onMove);
            resizeHandle.removeEventListener('pointerup', onUp);
            resizeHandle.removeEventListener('pointercancel', onUp);
        };
        resizeHandle.addEventListener('pointermove', onMove);
        resizeHandle.addEventListener('pointerup', onUp);
        resizeHandle.addEventListener('pointercancel', onUp);
    };
    resizeHandle.addEventListener('pointerdown', beginResize);
    const resizeCanvas = ()=>{
        const cw = Math.max(1, monitor.clientWidth);
        const ch = Math.max(1, monitor.clientHeight);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetW = Math.round(cw * dpr);
        const targetH = Math.round(ch * dpr);
        if (monitor.width !== targetW || monitor.height !== targetH) {
            monitor.width = targetW;
            monitor.height = targetH;
        }
    };
    new ResizeObserver(()=>resizeCanvas()).observe(wrap);
    resizeCanvas();
    window.addEventListener('resize', ()=>applyLayout());
    const buffer = [];
    const drawMonitor = ()=>{
        resizeCanvas();
        const ctx = mctx;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = monitor.width;
        const h = monitor.height;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#0a1018';
        ctx.fillRect(0, 0, w, h);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const cw = w / dpr;
        const ch = h / dpr;
        const stripH = ch / 2;
        const drawStrip = (y0, label, color, key)=>{
            ctx.strokeStyle = 'rgba(138,153,173,.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, y0 + stripH / 2);
            ctx.lineTo(cw, y0 + stripH / 2);
            ctx.stroke();
            ctx.fillStyle = color;
            ctx.font = '600 10px ui-monospace, Menlo, Consolas, monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(label, 7, y0 + 5);
            if (buffer.length < 2) return;
            const tMax = buffer[buffer.length - 1].t;
            const tMin = tMax - MONITOR_WINDOW;
            const xOf = (t)=>(t - tMin) / MONITOR_WINDOW * cw;
            const yOf = (v)=>y0 + stripH / 2 - v / MONITOR_MAXV * (stripH / 2 - 12);
            ctx.lineWidth = 1.5;
            for(let i = 1; i < buffer.length; i++){
                const a = buffer[i - 1];
                const b = buffer[i];
                if (b.t < tMin) continue;
                const blankSeg = key === 'ux' && b.blank;
                ctx.strokeStyle = blankSeg ? 'rgba(138,153,173,.35)' : color;
                ctx.beginPath();
                ctx.moveTo(xOf(Math.max(a.t, tMin)), yOf(a[key]));
                ctx.lineTo(xOf(b.t), yOf(b[key]));
                ctx.stroke();
            }
        };
        drawStrip(0, 'Ux 扫描电压', CYAN, 'ux');
        drawStrip(stripH, 'Uy 偏转电压', PINK, 'uy');
    };
    return {
        pushSample (s) {
            uyReadout.textContent = `${s.uy >= 0 ? '+' : ''}${s.uy.toFixed(1)}`;
            uxReadout.textContent = `${s.ux >= 0 ? '+' : ''}${s.ux.toFixed(1)}`;
            buffer.push({
                t: s.t,
                uy: s.uy,
                ux: s.ux,
                blank: s.blank
            });
            while(buffer.length > 0 && buffer[0].t < s.t - MONITOR_WINDOW - 1)buffer.shift();
            drawMonitor();
        }
    };
}





function initApp() {
    const app = document.getElementById('app');
    if (!app) {
        console.error('App element not found');
        return;
    }
    const state = {
        ...DEFAULT_STATE
    };
    let scene;
    const ui = createUI(app, state, {
        onStateChange: (patch)=>scene.updateState(patch),
        onView: (v)=>scene.setView(v),
        onClear: ()=>scene.clearPhosphor()
    });
    const mount = app.querySelector('#canvas-mount');
    if (!mount) {
        console.error('canvas mount not found');
        return;
    }
    scene = new ScopeScene(mount, state);
    scene.onSample = (s)=>ui.pushSample(s);
}




initApp();

    </script>
  </body>
</html>
